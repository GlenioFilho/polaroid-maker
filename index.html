<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaroid Maker</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#c8553d">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <section class="view">
    <div id="stage"></div>
    <div class="view-top">
      <div class="brand">Polaroid <b>Maker</b></div>
      <div class="status" id="status">Carregando…</div>
    </div>
    <div class="view-bottom">
      <div class="dims" id="dims"></div>
      <div class="view-actions">
        <label class="chip"><input type="checkbox" id="showPhoto" checked> Foto</label>
        <label class="chip">📷 Minha foto<input type="file" id="myPhoto" accept="image/*" hidden></label>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="sec">
      <h2>Modelo</h2>
      <div class="models" id="models"></div>
      <p class="hint" id="modelDesc"></p>
    </div>

    <div class="sec">
      <h2>Foto e encaixe</h2>
      <label class="row">Tamanho da foto
        <select id="photoSize"></select>
      </label>
      <label class="row">Folga da fenda <output id="gapOut"></output>
        <input type="range" id="gap" min="1.2" max="2.4" step="0.1">
      </label>
      <label class="row">Tamanho do suporte <output id="scaleOut"></output>
        <input type="range" id="scale" min="80" max="130" step="5">
      </label>
      <div id="modelOpts"></div>
    </div>

    <div class="sec" id="textSec">
      <h2>Texto</h2>
      <input type="text" id="line1" maxlength="30" placeholder="Nome (ex.: Ana & Leo)">
      <input type="text" id="line2" maxlength="30" placeholder="Data ou 2ª linha (opcional)">
      <p class="hint" id="sizeHint" style="margin:0 0 10px"></p>
      <div class="fonts" id="fonts"></div>
      <div class="seg" id="textMode">
        <button data-mode="relevo">Relevo</button>
        <button data-mode="embutido">Embutido</button>
        <button data-mode="gravado">Gravado</button>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>
    <div class="sec" id="noTextSec" hidden>
      <h2>Texto</h2>
      <p class="hint">Este modelo não tem área plana para texto. Quase todos os outros têm.</p>
    </div>

    <div class="sec" id="texSec">
      <h2>Textura</h2>
      <div class="seg" id="texMode">
        <button data-tex="lisa">Lisa</button>
        <button data-tex="croche">Crochê</button>
        <button data-tex="trico">Tricô</button>
      </div>
      <p class="hint" id="texHint"></p>
    </div>

    <div class="sec">
      <h2>Cores</h2>
      <div id="colors"></div>
      <div class="filaments" id="filaments"></div>
    </div>

    <div class="sec">
      <h2>Baixar</h2>
      <button class="primary" id="dl3mf">Baixar 3MF multicor (Bambu Studio)</button>
      <div class="dl-row">
        <button id="dl3mfPrusa" title="Formato do PrusaSlicer">3MF Prusa</button>
        <button id="dlZip">STL por cor (.zip)</button>
        <button id="dlStl">STL único</button>
      </div>
      <p class="hint" id="printHint"></p>
    </div>
  </aside>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
